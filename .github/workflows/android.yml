name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feat/pwa-drawing-app]
    paths: ['twa-manifest.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Set ANDROID_KEYSTORE_BASE64 in repository secrets" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE: ${{ github.workspace }}/android.keystore
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap doctor
          bubblewrap build --skipPwaValidation
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sketchpad-android-apk
          path: '**/app-release-signed.apk'
          if-no-files-found: error
          retention-days: 14
      - name: Clean up signing key
        if: always()
        run: rm -f android.keystore